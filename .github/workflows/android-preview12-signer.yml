name: Android Preview12 Fleet-native signer

on:
  workflow_dispatch:
    inputs:
      source_sha: {description: Exact chummer-android source commit, required: true, type: string}
      candidate_run_id: {description: Exact candidate run ID, required: true, type: string}
      candidate_artifact_id: {description: Exact candidate artifact ID, required: true, type: string}
      candidate_artifact_sha256: {description: Exact candidate archive SHA-256, required: true, type: string}
      candidate_aab_sha256: {description: Exact unsigned AAB SHA-256, required: true, type: string}
      verification_run_id: {description: Exact candidate-bound verification run ID, required: true, type: string}
      verification_artifact_id: {description: Exact verification artifact ID, required: true, type: string}
      verification_artifact_sha256: {description: Exact verification archive SHA-256, required: true, type: string}
      verification_receipt_sha256: {description: Exact verification receipt SHA-256, required: true, type: string}
permissions:
  contents: read

concurrency:
  group: android-preview12-signer-${{ inputs.candidate_artifact_id }}-${{ inputs.candidate_aab_sha256 }}
  cancel-in-progress: false
jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      signer_image: ${{ steps.preflight.outputs.signer_image }}
      intake_environment: ${{ steps.preflight.outputs.intake_environment }}
      signing_environment: ${{ steps.preflight.outputs.signing_environment }}
      transaction_inputs_sha256: ${{ steps.preflight.outputs.transaction_inputs_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {repository: ArchonMegalon/fleet, ref: "${{ job.workflow_sha }}", fetch-depth: 1, persist-credentials: false}
      - id: preflight
        env:
          SIGNER_IMAGE: ${{ vars.ANDROID_PREVIEW12_SIGNER_IMAGE }}
          EXECUTION_REPOSITORY: ${{ github.repository }}
          EXECUTION_REF: ${{ github.ref }}
          EXECUTION_REF_PROTECTED: ${{ github.ref_protected }}
          EXECUTION_EVENT: ${{ github.event_name }}
          EXECUTION_SHA: ${{ github.sha }}
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_REF: ${{ job.workflow_ref }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_ARTIFACT_ID: ${{ inputs.candidate_artifact_id }}
          CANDIDATE_ARTIFACT_SHA256: ${{ inputs.candidate_artifact_sha256 }}
          CANDIDATE_AAB_SHA256: ${{ inputs.candidate_aab_sha256 }}
          VERIFICATION_RUN_ID: ${{ inputs.verification_run_id }}
          VERIFICATION_ARTIFACT_ID: ${{ inputs.verification_artifact_id }}
          VERIFICATION_ARTIFACT_SHA256: ${{ inputs.verification_artifact_sha256 }}
          VERIFICATION_RECEIPT_SHA256: ${{ inputs.verification_receipt_sha256 }}
        run: >-
          python3 scripts/android_preview12_signer.py --lock config/release/android-preview12-signer.lock.json
          --toolchain-lock config/release/android-preview12-signer-toolchain.lock.json dispatch-preflight
          --signer-image "$SIGNER_IMAGE" --execution-repository "$EXECUTION_REPOSITORY"
          --execution-ref "$EXECUTION_REF" --execution-ref-protected "$EXECUTION_REF_PROTECTED"
          --execution-event "$EXECUTION_EVENT" --execution-sha "$EXECUTION_SHA"
          --workflow-repository "$WORKFLOW_REPOSITORY" --workflow-ref "$WORKFLOW_REF" --workflow-sha "$WORKFLOW_SHA"
          --source-sha "$SOURCE_SHA" --candidate-run-id "$CANDIDATE_RUN_ID"
          --candidate-artifact-id "$CANDIDATE_ARTIFACT_ID" --candidate-artifact-sha256 "$CANDIDATE_ARTIFACT_SHA256"
          --candidate-aab-sha256 "$CANDIDATE_AAB_SHA256" --verification-run-id "$VERIFICATION_RUN_ID"
          --verification-artifact-id "$VERIFICATION_ARTIFACT_ID"
          --verification-artifact-sha256 "$VERIFICATION_ARTIFACT_SHA256"
          --verification-receipt-sha256 "$VERIFICATION_RECEIPT_SHA256" --github-output "$GITHUB_OUTPUT"

  trusted-intake:
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: ${{ needs.contract.outputs.intake_environment }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ArchonMegalon/fleet
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact producer evidence and sanitize unsigned bytes
        env:
          ANDROID_PREVIEW12_CANDIDATE_BROKER_TOKEN: ${{ secrets.ANDROID_PREVIEW12_CANDIDATE_BROKER_TOKEN }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_ARTIFACT_ID: ${{ inputs.candidate_artifact_id }}
          CANDIDATE_ARTIFACT_SHA256: ${{ inputs.candidate_artifact_sha256 }}
          CANDIDATE_AAB_SHA256: ${{ inputs.candidate_aab_sha256 }}
          VERIFICATION_RUN_ID: ${{ inputs.verification_run_id }}
          VERIFICATION_ARTIFACT_ID: ${{ inputs.verification_artifact_id }}
          VERIFICATION_ARTIFACT_SHA256: ${{ inputs.verification_artifact_sha256 }}
          VERIFICATION_RECEIPT_SHA256: ${{ inputs.verification_receipt_sha256 }}
        run: >-
          python3 scripts/android_preview12_signer.py
          --lock config/release/android-preview12-signer.lock.json
          --toolchain-lock config/release/android-preview12-signer-toolchain.lock.json
          intake --source-sha "$SOURCE_SHA" --candidate-run-id "$CANDIDATE_RUN_ID"
          --candidate-artifact-id "$CANDIDATE_ARTIFACT_ID" --candidate-artifact-sha256 "$CANDIDATE_ARTIFACT_SHA256"
          --candidate-aab-sha256 "$CANDIDATE_AAB_SHA256" --verification-run-id "$VERIFICATION_RUN_ID"
          --verification-artifact-id "$VERIFICATION_ARTIFACT_ID"
          --verification-artifact-sha256 "$VERIFICATION_ARTIFACT_SHA256"
          --verification-receipt-sha256 "$VERIFICATION_RECEIPT_SHA256" --output-dir trusted-intake
      - name: Transport only sanitized intake and evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: preview12-intake-${{ inputs.candidate_artifact_id }}-${{ inputs.candidate_aab_sha256 }}
          path: trusted-intake
          if-no-files-found: error
          compression-level: 0
          overwrite: false
          include-hidden-files: false
          retention-days: 1

  sign-once:
    needs: [contract, trusted-intake]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: ${{ needs.contract.outputs.signing_environment }}
    container:
      image: ${{ needs.contract.outputs.signer_image }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: preview12-intake-${{ inputs.candidate_artifact_id }}-${{ inputs.candidate_aab_sha256 }}
          path: trusted-intake
      - name: Reserve durable exactly-once transaction before key access
        env:
          ANDROID_PREVIEW12_LEDGER_TOKEN: ${{ secrets.ANDROID_PREVIEW12_LEDGER_TOKEN }}
          FLEET_SIGNING_ENVIRONMENT: ${{ needs.contract.outputs.signing_environment }}
          FLEET_WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          FLEET_WORKFLOW_REF: ${{ job.workflow_ref }}
          FLEET_WORKFLOW_SHA: ${{ job.workflow_sha }}
          LOCKED_SIGNER_IMAGE: ${{ needs.contract.outputs.signer_image }}
        run: >-
          python3 /opt/fleet-signer/android_preview12_signer.py --lock trusted-intake/signer.lock.json
          --toolchain-lock /opt/fleet-signer/toolchain.lock.json reserve --candidate-dir trusted-intake
          --installed-toolchain-receipt /opt/fleet-signer/toolchain-installed.json
          --running-image "$LOCKED_SIGNER_IMAGE" --output "$RUNNER_TEMP/reservation.json"
      - name: Sign once after all non-secret and reservation gates
        env:
          ANDROID_PREVIEW12_UPLOAD_KEYSTORE_B64: ${{ secrets.ANDROID_PREVIEW12_UPLOAD_KEYSTORE_B64 }}
          ANDROID_PREVIEW12_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_PREVIEW12_KEYSTORE_PASSWORD }}
          ANDROID_PREVIEW12_KEY_PASSWORD: ${{ secrets.ANDROID_PREVIEW12_KEY_PASSWORD }}
          FLEET_SIGNING_ENVIRONMENT: ${{ needs.contract.outputs.signing_environment }}
          FLEET_WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          FLEET_WORKFLOW_REF: ${{ job.workflow_ref }}
          FLEET_WORKFLOW_SHA: ${{ job.workflow_sha }}
          LOCKED_SIGNER_IMAGE: ${{ needs.contract.outputs.signer_image }}
        run: >-
          python3 /opt/fleet-signer/android_preview12_signer.py --lock trusted-intake/signer.lock.json
          --toolchain-lock /opt/fleet-signer/toolchain.lock.json sign --candidate-dir trusted-intake
          --installed-toolchain-receipt /opt/fleet-signer/toolchain-installed.json
          --reservation-receipt "$RUNNER_TEMP/reservation.json" --output-dir "$RUNNER_TEMP/signed-output"
          --running-image "$LOCKED_SIGNER_IMAGE"
      - name: Hand off signed content to the private immutable store and verify readback
        env:
          ANDROID_PREVIEW12_HANDOFF_ACCESS_TOKEN: ${{ secrets.ANDROID_PREVIEW12_HANDOFF_ACCESS_TOKEN }}
          FLEET_SIGNING_ENVIRONMENT: ${{ needs.contract.outputs.signing_environment }}
          FLEET_WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          FLEET_WORKFLOW_REF: ${{ job.workflow_ref }}
          FLEET_WORKFLOW_SHA: ${{ job.workflow_sha }}
          LOCKED_SIGNER_IMAGE: ${{ needs.contract.outputs.signer_image }}
        run: >-
          python3 /opt/fleet-signer/android_preview12_signer.py --lock trusted-intake/signer.lock.json
          --toolchain-lock /opt/fleet-signer/toolchain.lock.json handoff --candidate-dir trusted-intake
          --signed-dir "$RUNNER_TEMP/signed-output"
          --installed-toolchain-receipt /opt/fleet-signer/toolchain-installed.json
          --reservation-receipt "$RUNNER_TEMP/reservation.json"
          --running-image "$LOCKED_SIGNER_IMAGE" --output "$RUNNER_TEMP/private-handoff-audit.json"
