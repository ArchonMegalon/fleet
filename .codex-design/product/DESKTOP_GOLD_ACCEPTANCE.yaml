    - UI_FLAGSHIP_RELEASE_GATE.generated.json
  required_screenshots:
    - 01-initial-shell-light.png
    - 04-loaded-runner-light.png
    - 05-dense-section-light.png
    - 06-dense-section-dark.png
    - 16-master-index-dialog-light.png
    - 17-character-roster-dialog-light.png
    - 19-workflow-file-menu-loaded-light.png
    - 36-workflow-new-character-dialog-light.png
    - validation_or_export_smoke-before.png
    - validation_or_export_smoke-after.png
  screenshot_thresholds:
    minimum_bytes: 10000
    minimum_width: 200
    minimum_height: 120
  required_first_minute_workflows:
    - master_index_search_focus_stability
    - file_new_character_visible_workspace
    - minimal_character_build_save_reload
    - major_navigation_sanity
