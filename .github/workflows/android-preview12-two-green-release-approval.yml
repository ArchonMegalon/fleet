name: Android Preview12 Two-Green Ed25519 release approval (dormant)

on:
  workflow_dispatch:
    inputs:
      approval_request_nonce: {description: Fresh lowercase 256-bit challenge nonce, required: true, type: string}
      two_green_run_id: {description: Exact successful Two-Green workflow run ID, required: true, type: string}
      two_green_run_attempt: {description: Exact Two-Green workflow run attempt, required: true, type: string}
      two_green_artifact_id: {description: Exact Two-Green eligibility artifact ID, required: true, type: string}
      two_green_artifact_sha256: {description: Exact Two-Green artifact archive SHA-256, required: true, type: string}
      two_green_receipt_sha256: {description: Exact Two-Green receipt SHA-256, required: true, type: string}
      review_run_id: {description: Exact reviewed API-36 run ID bound by Two-Green, required: true, type: string}
      review_pull_request_number: {description: Exact reviewed pull request bound by Two-Green, required: true, type: string}
      main_run_id: {description: Exact main API-36 run ID bound by Two-Green, required: true, type: string}
      main_commit: {description: Exact Android main commit bound by Two-Green, required: true, type: string}
      main_tree: {description: Exact Android main tree bound by Two-Green, required: true, type: string}
      version_name: {description: Must be 0.1.0-preview.12, required: true, type: string}
      version_code: {description: Must be 12, required: true, type: string}

permissions:
  actions: read
  contents: read
  deployments: read

concurrency:
  group: preview12-two-green-release-approval-${{ inputs.two_green_artifact_id }}
  cancel-in-progress: false

jobs:
  dormant-contract:
    name: Require reviewed activation on protected Fleet main
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      environment: ${{ steps.contract.outputs.environment }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ArchonMegalon/fleet
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - id: contract
        env:
          APPROVAL_REQUEST_NONCE: ${{ inputs.approval_request_nonce }}
          TWO_GREEN_RUN_ID: ${{ inputs.two_green_run_id }}
          TWO_GREEN_RUN_ATTEMPT: ${{ inputs.two_green_run_attempt }}
          TWO_GREEN_ARTIFACT_ID: ${{ inputs.two_green_artifact_id }}
          TWO_GREEN_ARTIFACT_SHA256: ${{ inputs.two_green_artifact_sha256 }}
          TWO_GREEN_RECEIPT_SHA256: ${{ inputs.two_green_receipt_sha256 }}
          REVIEW_RUN_ID: ${{ inputs.review_run_id }}
          REVIEW_PULL_REQUEST_NUMBER: ${{ inputs.review_pull_request_number }}
          MAIN_RUN_ID: ${{ inputs.main_run_id }}
          MAIN_COMMIT: ${{ inputs.main_commit }}
          MAIN_TREE: ${{ inputs.main_tree }}
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
          EXECUTION_REPOSITORY: ${{ github.repository }}
          EXECUTION_REF: ${{ github.ref }}
          EXECUTION_REF_PROTECTED: ${{ github.ref_protected }}
          EXECUTION_EVENT: ${{ github.event_name }}
          EXECUTION_SHA: ${{ github.sha }}
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_REF: ${{ job.workflow_ref }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          python3 scripts/android_preview12_two_green_release_approval.py \
            --policy "$GITHUB_WORKSPACE/config/release/android-preview12-two-green-release-approval.json" \
            preflight \
            --approval-request-nonce "$APPROVAL_REQUEST_NONCE" \
            --two-green-run-id "$TWO_GREEN_RUN_ID" \
            --two-green-run-attempt "$TWO_GREEN_RUN_ATTEMPT" \
            --two-green-artifact-id "$TWO_GREEN_ARTIFACT_ID" \
            --two-green-artifact-sha256 "$TWO_GREEN_ARTIFACT_SHA256" \
            --two-green-receipt-sha256 "$TWO_GREEN_RECEIPT_SHA256" \
            --review-run-id "$REVIEW_RUN_ID" \
            --review-pull-request-number "$REVIEW_PULL_REQUEST_NUMBER" \
            --main-run-id "$MAIN_RUN_ID" \
            --main-commit "$MAIN_COMMIT" \
            --main-tree "$MAIN_TREE" \
            --version-name "$VERSION_NAME" \
            --version-code "$VERSION_CODE" \
            --execution-repository "$EXECUTION_REPOSITORY" \
            --execution-ref "$EXECUTION_REF" \
            --execution-ref-protected "$EXECUTION_REF_PROTECTED" \
            --execution-event "$EXECUTION_EVENT" \
            --execution-sha "$EXECUTION_SHA" \
            --workflow-repository "$WORKFLOW_REPOSITORY" \
            --workflow-ref "$WORKFLOW_REF" \
            --workflow-sha "$WORKFLOW_SHA"
          echo 'environment=android-preview12-release-approval' >>"$GITHUB_OUTPUT"

  approve-public-json:
    name: Human-reviewed Ed25519 approval of Two-Green JSON only
    needs: dormant-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: ${{ needs.dormant-contract.outputs.environment }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ArchonMegalon/fleet
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Fetch exact public authority snapshots and Two-Green archive
        env:
          GH_TOKEN: ${{ github.token }}
          TWO_GREEN_RUN_ID: ${{ inputs.two_green_run_id }}
          TWO_GREEN_ARTIFACT_ID: ${{ inputs.two_green_artifact_id }}
          MAIN_COMMIT: ${{ inputs.main_commit }}
          FLEET_EXECUTION_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/preview12-approval-evidence"
          output="$RUNNER_TEMP/preview12-approval-public"
          install -d -m 0700 "$evidence"
          install -d -m 0700 "$output"
          gh api -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/ArchonMegalon/chummer-android/actions/runs/$TWO_GREEN_RUN_ID" >"$evidence/run.json"
          gh api -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/ArchonMegalon/chummer-android/actions/artifacts/$TWO_GREEN_ARTIFACT_ID" >"$evidence/artifact.json"
          gh api -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/ArchonMegalon/chummer-android/actions/artifacts/$TWO_GREEN_ARTIFACT_ID/zip" >"$evidence/artifact.zip"
          gh api -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' \
            'repos/ArchonMegalon/fleet/environments/android-preview12-release-approval' >"$evidence/environment.json"
          gh api -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' \
            'repos/ArchonMegalon/chummer-android/branches/main' >"$evidence/android-main-branch.json"
          gh api -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/ArchonMegalon/chummer-android/git/commits/$MAIN_COMMIT" >"$evidence/android-main-commit.json"
          gh api -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' \
            'repos/ArchonMegalon/fleet/branches/main' >"$evidence/fleet-main-branch.json"
          gh api -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/ArchonMegalon/fleet/git/commits/$FLEET_EXECUTION_SHA" >"$evidence/fleet-main-commit.json"
          approval_artifact_name="android-preview12-two-green-release-approval-$TWO_GREEN_ARTIFACT_ID"
          gh api -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/ArchonMegalon/fleet/actions/artifacts?per_page=100&name=$approval_artifact_name" \
            >"$evidence/approval-artifact-ledger.json"
      - id: reserve
        name: Reserve exact approval subject in the durable external ledger
        env:
          ANDROID_PREVIEW12_APPROVAL_LEDGER_BEARER_TOKEN: ${{ secrets.ANDROID_PREVIEW12_APPROVAL_LEDGER_BEARER_TOKEN }}
          APPROVAL_REQUEST_NONCE: ${{ inputs.approval_request_nonce }}
          TWO_GREEN_ARTIFACT_ID: ${{ inputs.two_green_artifact_id }}
          TWO_GREEN_ARTIFACT_SHA256: ${{ inputs.two_green_artifact_sha256 }}
          TWO_GREEN_RECEIPT_SHA256: ${{ inputs.two_green_receipt_sha256 }}
          MAIN_TREE: ${{ inputs.main_tree }}
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/preview12-approval-evidence"
          output="$RUNNER_TEMP/preview12-approval-public"
          policy="$GITHUB_WORKSPACE/config/release/android-preview12-two-green-release-approval.json"
          python3 scripts/android_preview12_approval_ledger.py \
            --policy "$policy" reserve \
            --approval-request-nonce "$APPROVAL_REQUEST_NONCE" \
            --two-green-artifact-id "$TWO_GREEN_ARTIFACT_ID" \
            --two-green-artifact-sha256 "$TWO_GREEN_ARTIFACT_SHA256" \
            --two-green-receipt-sha256 "$TWO_GREEN_RECEIPT_SHA256" \
            --main-tree "$MAIN_TREE" \
            --version-name "$VERSION_NAME" \
            --version-code "$VERSION_CODE" \
            --receipt-output "$evidence/ledger-reservation.json" \
            --committed-approval-output "$output/recovered-public-approval.json"
          if test -f "$output/recovered-public-approval.json"; then
            echo 'recovered=true' >>"$GITHUB_OUTPUT"
          else
            echo 'recovered=false' >>"$GITHUB_OUTPUT"
          fi
      - name: Restore the exact already-committed public approval
        if: ${{ steps.reserve.outputs.recovered == 'true' }}
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/preview12-approval-public"
          install -m 0600 "$output/recovered-public-approval.json" \
            "$output/ANDROID_PREVIEW12_TWO_GREEN_RELEASE_APPROVAL.public.json"
      - name: Emit only the public, non-authorizing approval JSON
        if: ${{ steps.reserve.outputs.recovered != 'true' }}
        env:
          ANDROID_PREVIEW12_RELEASE_APPROVAL_ED25519_PRIVATE_KEY_PKCS8_B64: ${{ secrets.ANDROID_PREVIEW12_RELEASE_APPROVAL_ED25519_PRIVATE_KEY_PKCS8_B64 }}
          APPROVAL_REQUEST_NONCE: ${{ inputs.approval_request_nonce }}
          TWO_GREEN_RUN_ID: ${{ inputs.two_green_run_id }}
          TWO_GREEN_RUN_ATTEMPT: ${{ inputs.two_green_run_attempt }}
          TWO_GREEN_ARTIFACT_ID: ${{ inputs.two_green_artifact_id }}
          TWO_GREEN_ARTIFACT_SHA256: ${{ inputs.two_green_artifact_sha256 }}
          TWO_GREEN_RECEIPT_SHA256: ${{ inputs.two_green_receipt_sha256 }}
          REVIEW_RUN_ID: ${{ inputs.review_run_id }}
          REVIEW_PULL_REQUEST_NUMBER: ${{ inputs.review_pull_request_number }}
          MAIN_RUN_ID: ${{ inputs.main_run_id }}
          MAIN_COMMIT: ${{ inputs.main_commit }}
          MAIN_TREE: ${{ inputs.main_tree }}
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
          EXECUTION_REF_PROTECTED: ${{ github.ref_protected }}
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_REF: ${{ job.workflow_ref }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/preview12-approval-evidence"
          output="$RUNNER_TEMP/preview12-approval-public"
          policy="$GITHUB_WORKSPACE/config/release/android-preview12-two-green-release-approval.json"
          python3 scripts/android_preview12_two_green_release_approval.py \
            --policy "$policy" approve \
            --approval-request-nonce "$APPROVAL_REQUEST_NONCE" \
            --two-green-run-id "$TWO_GREEN_RUN_ID" \
            --two-green-run-attempt "$TWO_GREEN_RUN_ATTEMPT" \
            --two-green-artifact-id "$TWO_GREEN_ARTIFACT_ID" \
            --two-green-artifact-sha256 "$TWO_GREEN_ARTIFACT_SHA256" \
            --two-green-receipt-sha256 "$TWO_GREEN_RECEIPT_SHA256" \
            --review-run-id "$REVIEW_RUN_ID" \
            --review-pull-request-number "$REVIEW_PULL_REQUEST_NUMBER" \
            --main-run-id "$MAIN_RUN_ID" \
            --main-commit "$MAIN_COMMIT" \
            --main-tree "$MAIN_TREE" \
            --version-name "$VERSION_NAME" \
            --version-code "$VERSION_CODE" \
            --execution-repository "$GITHUB_REPOSITORY" \
            --execution-ref "$GITHUB_REF" \
            --execution-ref-protected "$EXECUTION_REF_PROTECTED" \
            --execution-event "$GITHUB_EVENT_NAME" \
            --execution-sha "$GITHUB_SHA" \
            --workflow-repository "$WORKFLOW_REPOSITORY" \
            --workflow-ref "$WORKFLOW_REF" \
            --workflow-sha "$WORKFLOW_SHA" \
            --execution-run-id "$GITHUB_RUN_ID" \
            --execution-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --execution-environment android-preview12-release-approval \
            --environment-snapshot "$evidence/environment.json" \
            --ledger-reservation-snapshot "$evidence/ledger-reservation.json" \
            --run-snapshot "$evidence/run.json" \
            --artifact-snapshot "$evidence/artifact.json" \
            --artifact-archive "$evidence/artifact.zip" \
            --android-main-branch-snapshot "$evidence/android-main-branch.json" \
            --android-main-commit-snapshot "$evidence/android-main-commit.json" \
            --fleet-main-branch-snapshot "$evidence/fleet-main-branch.json" \
            --fleet-main-commit-snapshot "$evidence/fleet-main-commit.json" \
            --approval-artifact-ledger-snapshot "$evidence/approval-artifact-ledger.json" \
            --output "$output/ANDROID_PREVIEW12_TWO_GREEN_RELEASE_APPROVAL.public.json"
      - id: commit
        name: Commit the exact public approval to the durable external ledger
        env:
          ANDROID_PREVIEW12_APPROVAL_LEDGER_BEARER_TOKEN: ${{ secrets.ANDROID_PREVIEW12_APPROVAL_LEDGER_BEARER_TOKEN }}
          APPROVAL_REQUEST_NONCE: ${{ inputs.approval_request_nonce }}
          TWO_GREEN_ARTIFACT_ID: ${{ inputs.two_green_artifact_id }}
          TWO_GREEN_ARTIFACT_SHA256: ${{ inputs.two_green_artifact_sha256 }}
          TWO_GREEN_RECEIPT_SHA256: ${{ inputs.two_green_receipt_sha256 }}
          MAIN_TREE: ${{ inputs.main_tree }}
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/preview12-approval-evidence"
          output="$RUNNER_TEMP/preview12-approval-public"
          policy="$GITHUB_WORKSPACE/config/release/android-preview12-two-green-release-approval.json"
          python3 scripts/android_preview12_approval_ledger.py \
            --policy "$policy" commit \
            --approval-request-nonce "$APPROVAL_REQUEST_NONCE" \
            --two-green-artifact-id "$TWO_GREEN_ARTIFACT_ID" \
            --two-green-artifact-sha256 "$TWO_GREEN_ARTIFACT_SHA256" \
            --two-green-receipt-sha256 "$TWO_GREEN_RECEIPT_SHA256" \
            --main-tree "$MAIN_TREE" \
            --version-name "$VERSION_NAME" \
            --version-code "$VERSION_CODE" \
            --reservation-snapshot "$evidence/ledger-reservation.json" \
            --approval "$output/ANDROID_PREVIEW12_TWO_GREEN_RELEASE_APPROVAL.public.json" \
            --receipt-output "$evidence/ledger-commit.json" \
            --committed-approval-output "$output/ledger-committed-public-approval.json"
      - name: Abort an open reservation after an interrupted approval transaction
        if: ${{ always() && steps.reserve.outcome == 'success' && steps.commit.outcome != 'success' }}
        env:
          ANDROID_PREVIEW12_APPROVAL_LEDGER_BEARER_TOKEN: ${{ secrets.ANDROID_PREVIEW12_APPROVAL_LEDGER_BEARER_TOKEN }}
          APPROVAL_REQUEST_NONCE: ${{ inputs.approval_request_nonce }}
          TWO_GREEN_ARTIFACT_ID: ${{ inputs.two_green_artifact_id }}
          TWO_GREEN_ARTIFACT_SHA256: ${{ inputs.two_green_artifact_sha256 }}
          TWO_GREEN_RECEIPT_SHA256: ${{ inputs.two_green_receipt_sha256 }}
          MAIN_TREE: ${{ inputs.main_tree }}
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/preview12-approval-evidence"
          policy="$GITHUB_WORKSPACE/config/release/android-preview12-two-green-release-approval.json"
          python3 scripts/android_preview12_approval_ledger.py \
            --policy "$policy" cleanup \
            --approval-request-nonce "$APPROVAL_REQUEST_NONCE" \
            --two-green-artifact-id "$TWO_GREEN_ARTIFACT_ID" \
            --two-green-artifact-sha256 "$TWO_GREEN_ARTIFACT_SHA256" \
            --two-green-receipt-sha256 "$TWO_GREEN_RECEIPT_SHA256" \
            --main-tree "$MAIN_TREE" \
            --version-name "$VERSION_NAME" \
            --version-code "$VERSION_CODE" \
            --reservation-snapshot "$evidence/ledger-reservation.json" \
            --reason-code workflow_interrupted \
            --receipt-output "$evidence/ledger-cleanup.json"
      - name: Verify only the public approval and committed ledger bytes
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/preview12-approval-evidence"
          output="$RUNNER_TEMP/preview12-approval-public"
          policy="$GITHUB_WORKSPACE/config/release/android-preview12-two-green-release-approval.json"
          cmp --silent \
            "$output/ANDROID_PREVIEW12_TWO_GREEN_RELEASE_APPROVAL.public.json" \
            "$output/ledger-committed-public-approval.json"
          install -m 0600 "$evidence/ledger-commit.json" \
            "$output/ANDROID_PREVIEW12_APPROVAL_LEDGER_COMMIT.public.json"
          python3 scripts/android_preview12_two_green_release_approval.py \
            --policy "$policy" \
            verify --approval "$output/ANDROID_PREVIEW12_TWO_GREEN_RELEASE_APPROVAL.public.json"
          jq -e '.signingAuthorized == false and .publicationAuthorized == false and .googlePlayUploadAuthorized == false' \
            "$output/ANDROID_PREVIEW12_TWO_GREEN_RELEASE_APPROVAL.public.json" >/dev/null
      - name: Upload only the public approval and signed commit receipt JSON
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-preview12-two-green-release-approval-${{ inputs.two_green_artifact_id }}
          path: |
            ${{ runner.temp }}/preview12-approval-public/ANDROID_PREVIEW12_TWO_GREEN_RELEASE_APPROVAL.public.json
            ${{ runner.temp }}/preview12-approval-public/ANDROID_PREVIEW12_APPROVAL_LEDGER_COMMIT.public.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          overwrite: false
          include-hidden-files: false
