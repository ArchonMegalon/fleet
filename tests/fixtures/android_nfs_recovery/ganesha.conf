# Candidate for the pinned Ganesha 4.3 package. Package/config admission remains
# blocked until the complete offline image closure is available and reviewed.
NFS_CORE_PARAM {
    Protocols = 4;
    Enable_NLM = false;
    Enable_RQUOTA = false;
}
NFSv4 {
    Minor_Versions = 1;
    # This isolated AUTH_SYS fixture has no shared name/idmapping domain.
    # Emit the actual numeric owner IDs; do not remap anonymous IDs to root.
    Allow_Numeric_Owners = true;
    Only_Numeric_Owners = true;
    Grace_Period = 10;
    Lease_Lifetime = 10;
    RecoveryBackend = fs_ng;
}
EXPORT {
    Export_Id = 41;
    Path = /export;
    Pseudo = /qualify;
    Access_Type = None;
    Squash = Root_Squash;
    SecType = sys;
    Protocols = 4;
    Transports = TCP;
    FSAL { Name = VFS; }
    CLIENT {
        Clients = 172.30.249.3;
        Access_Type = RW;
        Squash = No_Root_Squash;
    }
}
