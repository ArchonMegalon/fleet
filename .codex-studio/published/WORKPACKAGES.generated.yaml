        - /docker/chummercomplete/scripts/avalonia-ux-discovery-backlog.json
      promotion:
        - /docker/chummercomplete/scripts/avalonia-ux-backlog-promoter.py
      fixer:
        - /docker/chummercomplete/scripts/avalonia-ux-backlog.json
        - /docker/chummercomplete/scripts/avalonia-polish-loop.py
    runtime:
      workers:
        - /docker/chummercomplete/scripts/avalonia-ux-backlog-feeder.sh
        - /docker/chummercomplete/scripts/avalonia-ux-backlog-promoter.sh
        - /docker/chummercomplete/scripts/avalonia-ux-polish-loop.sh
    completion_signals:
      - promoted backlog is empty
      - discovery backlog contains no unpromoted mapped findings
      - current Avalonia build verification remains green
  - id: wp-openai-credentials-shard
    title: OpenAI credential health shard
    status: in_progress
    lane: operator_trust
    owner: fleet-local
    objective: Keep one explicit Fleet shard watching OpenAI and ChatGPT credential readiness, auth-file availability, and surprise provider/auth regressions.
    scope:
      - OpenAI and ChatGPT account auth-file health
      - provider/auth surprise blocker visibility
      - operator rerun guidance when secrets are genuinely external
    feeds:
      config:
        - /docker/fleet/config/accounts.yaml
      supervisor:
        - /docker/fleet/scripts/chummer_design_supervisor.py
      keeper:
        - /docker/fleet/scripts/fleet_ooda_keeper.py
