name: Release QA - Rafter and Pixefy

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

concurrency:
  group: release-qa-rafter-pixefy-${{ github.ref }}
  cancel-in-progress: false

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/release-qa-rafter-pixefy.yml"
      - "_completion/ltd_inventory/RAFTER_TIER3_LTDS_ENTRY.generated.json"
      - "_completion/ltd_inventory/PIXEFY_TIER3_LTDS_ENTRY.generated.json"
      - "_completion/rafter/**"
      - "_completion/pixefy/**"
      - "_completion/rafter_pixefy/**"
      - "providers/rafter/**"
      - "providers/pixefy/**"
      - "scripts/rafter_pixefy_common.py"
      - "scripts/verify_committed_rafter_pixefy_ci_receipt.py"
      - "scripts/verify_ltds_rafter_pixefy_entries.py"
      - "scripts/final_rafter_pixefy_qa_stack_verdict.py"
      - "tests/test_rafter_pixefy_gate_verifier.py"
  pull_request:
    branches:
      - main

jobs:
  verify-ltd-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Verify Rafter/Pixefy LTD entries
        run: python3 scripts/verify_ltds_rafter_pixefy_entries.py
      - name: Assert LTD receipts stayed committed
        run: |
          git diff --exit-code -- \
            _completion/ltd_inventory/RAFTER_TIER3_LTDS_ENTRY.generated.json \
            _completion/ltd_inventory/PIXEFY_TIER3_LTDS_ENTRY.generated.json

  verifier-regression-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Run Rafter/Pixefy verifier regression tests
        run: python3 -m unittest tests.test_rafter_pixefy_gate_verifier

  rafter-security-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - verify-ltd-inventory
      - verifier-regression-tests
    steps:
      - uses: actions/checkout@v5
      - name: Verify committed Rafter provider and security receipts
        run: python3 scripts/verify_committed_rafter_pixefy_ci_receipt.py Rafter

  pixefy-visual-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - verify-ltd-inventory
      - verifier-regression-tests
    steps:
      - uses: actions/checkout@v5
      - name: Verify committed Pixefy provider and visual QA receipts
        run: python3 scripts/verify_committed_rafter_pixefy_ci_receipt.py Pixefy

  final-rafter-pixefy-verdict:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - rafter-security-gate
      - pixefy-visual-gate
    steps:
      - uses: actions/checkout@v5
      - name: Final Rafter/Pixefy verdict
        run: python3 scripts/final_rafter_pixefy_qa_stack_verdict.py
      - name: Assert generated Rafter/Pixefy receipts stayed committed
        run: |
          git diff --exit-code -- \
            _completion/ltd_inventory/RAFTER_TIER3_LTDS_ENTRY.generated.json \
            _completion/ltd_inventory/PIXEFY_TIER3_LTDS_ENTRY.generated.json \
            _completion/rafter_pixefy/FINAL_RAFTER_PIXEFY_QA_STACK_REASONS.generated.json
