version: chummer6-public-guide-new-section-verdict-v1
sections:
  - id: table-pulse
    title: Table Pulse
    public_guide_verdict: public_safe_horizon_page
    page_class: horizon_detail_page
    allowed_public_audience:
      - players
      - gms
      - supporters
    shipped_claim_allowed: false
    expected_representation: public_horizon_page_with_receipts_and_future_facing_boundaries
    required_proof:
      - horizon_registry_public_guide_enabled
      - bounded_privacy_and_consent_posture
    canonical_sources:
      - products/chummer/HORIZON_REGISTRY.yaml
      - products/chummer/horizons/table-pulse.md
      - products/chummer/TABLE_PULSE_HEAT_REACTION_AUDIT_20260523.md
      - products/chummer/TABLE_PULSE_OPTOUT_REMOTE_REACTION_AUDIT_20260523.md
      - products/chummer/TABLE_PULSE_LIVING_WORLD_STACK_20260523.md
    forbidden_claims:
      - shipped live-session feature
      - autonomous table mutation
      - public guide claims of fully shipped table pulse
    notes: >
      Table Pulse should appear as a public-safe split horizon page with two explicit rails.
      Table Pulse Live may explain world heat, remote recipient packets, bounded remote reaction
      mini-games, and the signed-in command lane that is live today on first-party routes. Table
      Pulse Aftermath should stay clearly private, GM-facing, and future-facing for coaching,
      transcript, narrated-summary, and table-dynamics analysis. The generated guide should not
      collapse world heat and table-dynamics heat into one ambiguous product promise.
